# Shared application tier
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-backend
  namespace: shared
  labels:
    app.kubernetes.io/name: zilla-backend
    app.kubernetes.io/component: backend
    zilla.io/model: shared
    monitoring.zilla.io/scrape: backend
spec:
  ports:
    - name: metrics
      port: 3000
      targetPort: 3000
  selector:
    app: zilla-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-backend
  namespace: shared
  labels:
    app.kubernetes.io/name: zilla-backend
    app.kubernetes.io/component: backend
    zilla.io/model: shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-backend
  template:
    metadata:
      labels:
        app: zilla-backend
        app.kubernetes.io/name: zilla-backend
        app.kubernetes.io/component: backend
        zilla.io/model: shared
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","until pg_isready -h postgres -p 5450; do sleep 2; done"]
        - name: wait-for-redis
          image: redis:6.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command: ["sh","-c","until redis-cli -h redis -p 6379 -a \"$REDIS_PASSWORD\" ping | grep -q PONG; do sleep 2; done"]
      containers:
        - name: zilla-backend
          image: zilla-backend:local-master-shared-c50a156
          imagePullPolicy: IfNotPresent
          command: ["node","build/index.js"]
          env:
            - name: ZILLA_MODEL
              value: shared
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5450"
            - name: DB_NAME
              value: zilla
            - name: DB_USER_AMAZON
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-amazon
                  key: DB_USERNAME
            - name: DB_PASS_AMAZON
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-amazon
                  key: DB_PASSWORD
            - name: DB_USER_AMD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-amd
                  key: DB_USERNAME
            - name: DB_PASS_AMD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-amd
                  key: DB_PASSWORD
            - name: DB_USER_APPLE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-apple
                  key: DB_USERNAME
            - name: DB_PASS_APPLE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-apple
                  key: DB_PASSWORD
            - name: DB_USER_AZURE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-azure
                  key: DB_USERNAME
            - name: DB_PASS_AZURE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-azure
                  key: DB_PASSWORD
            - name: DB_USER_GOOGLE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-google
                  key: DB_USERNAME
            - name: DB_PASS_GOOGLE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-google
                  key: DB_PASSWORD
            - name: DB_USER_META
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-meta
                  key: DB_USERNAME
            - name: DB_PASS_META
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-meta
                  key: DB_PASSWORD
            - name: DB_USER_NETFLIX
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-netflix
                  key: DB_USERNAME
            - name: DB_PASS_NETFLIX
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-netflix
                  key: DB_PASSWORD
            - name: DB_USER_NVIDIA
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-nvidia
                  key: DB_USERNAME
            - name: DB_PASS_NVIDIA
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-nvidia
                  key: DB_PASSWORD
            - name: DB_USER_PAYPAL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-paypal
                  key: DB_USERNAME
            - name: DB_PASS_PAYPAL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-paypal
                  key: DB_PASSWORD
            - name: DB_USER_REDDIT
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-reddit
                  key: DB_USERNAME
            - name: DB_PASS_REDDIT
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-reddit
                  key: DB_PASSWORD
            - name: DB_USER_SLACK
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-slack
                  key: DB_USERNAME
            - name: DB_PASS_SLACK
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-slack
                  key: DB_PASSWORD
            - name: DB_USER_SPOTIFY
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-spotify
                  key: DB_USERNAME
            - name: DB_PASS_SPOTIFY
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-spotify
                  key: DB_PASSWORD
            - name: DB_USER_TESLA
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-tesla
                  key: DB_USERNAME
            - name: DB_PASS_TESLA
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-tesla
                  key: DB_PASSWORD
            - name: DB_USER_UBER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-uber
                  key: DB_USERNAME
            - name: DB_PASS_UBER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-uber
                  key: DB_PASSWORD
            - name: DB_USER_ZOOM
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-zoom
                  key: DB_USERNAME
            - name: DB_PASS_ZOOM
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-zoom
                  key: DB_PASSWORD
            - name: JWT_SECRET
              value: secret
            - name: JWT_EXPIRES_IN_IN_SECONDS
              value: "100000"
            - name: NODE_ENV
              value: test
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: TENANT_CONFIG_PATH
              value: /etc/tenant-config/tenants.json
            - name: DB_POOL_MAX
              value: "2"
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: tenant-config
              mountPath: /etc/tenant-config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tenant-config
          configMap:
            name: tenant-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-config
  namespace: shared
  labels:
    app.kubernetes.io/name: tenant-config
    zilla.io/model: shared
data:
  tenants.json: |
    {
      "amazon": { "tenantId": "amazon", "schemaName": "amazon", "displayName": "Amazon", "redisDb": 1, "isActive": true },
      "amd": { "tenantId": "amd", "schemaName": "amd", "displayName": "Amd", "redisDb": 2, "isActive": true },
      "apple": { "tenantId": "apple", "schemaName": "apple", "displayName": "Apple", "redisDb": 3, "isActive": true },
      "azure": { "tenantId": "azure", "schemaName": "azure", "displayName": "Azure", "redisDb": 4, "isActive": true },
      "google": { "tenantId": "google", "schemaName": "google", "displayName": "Google", "redisDb": 5, "isActive": true },
      "meta": { "tenantId": "meta", "schemaName": "meta", "displayName": "Meta", "redisDb": 6, "isActive": true },
      "netflix": { "tenantId": "netflix", "schemaName": "netflix", "displayName": "Netflix", "redisDb": 7, "isActive": true },
      "nvidia": { "tenantId": "nvidia", "schemaName": "nvidia", "displayName": "Nvidia", "redisDb": 8, "isActive": true },
      "paypal": { "tenantId": "paypal", "schemaName": "paypal", "displayName": "Paypal", "redisDb": 9, "isActive": true },
      "reddit": { "tenantId": "reddit", "schemaName": "reddit", "displayName": "Reddit", "redisDb": 10, "isActive": true },
      "slack": { "tenantId": "slack", "schemaName": "slack", "displayName": "Slack", "redisDb": 11, "isActive": true },
      "spotify": { "tenantId": "spotify", "schemaName": "spotify", "displayName": "Spotify", "redisDb": 12, "isActive": true },
      "tesla": { "tenantId": "tesla", "schemaName": "tesla", "displayName": "Tesla", "redisDb": 13, "isActive": true },
      "uber": { "tenantId": "uber", "schemaName": "uber", "displayName": "Uber", "redisDb": 14, "isActive": true },
      "zoom": { "tenantId": "zoom", "schemaName": "zoom", "displayName": "Zoom", "redisDb": 15, "isActive": true }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: shared
  labels:
    app.kubernetes.io/name: nginx-bff
    zilla.io/model: shared
data:
  default.conf: |
    server {
      listen 80;
      location /api/ {
        proxy_pass http://zilla-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location / {
        proxy_pass http://zilla-frontend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-bff
  namespace: shared
  labels:
    app.kubernetes.io/name: nginx-bff
    zilla.io/model: shared
spec:
  type: LoadBalancer
  selector:
    app: nginx-bff
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bff
  namespace: shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-bff
  template:
    metadata:
      labels:
        app: nginx-bff
        app.kubernetes.io/name: nginx-bff
        zilla.io/model: shared
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-frontend
  namespace: shared
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: zilla-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-frontend
  namespace: shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-frontend
  template:
    metadata:
      labels:
        app: zilla-frontend
        app.kubernetes.io/name: zilla-frontend
        zilla.io/model: shared
    spec:
      containers:
        - name: zilla-frontend
          image: zilla-frontend:local-master-shared-3107d77
          imagePullPolicy: IfNotPresent
          command: ["npm","run","start"]
          env:
            - name: PORT
              value: "8080"
            - name: REACT_APP_NGINX_URL
              value: /api
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1536Mi
