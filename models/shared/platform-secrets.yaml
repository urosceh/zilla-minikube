apiVersion: v1
kind: Namespace
metadata:
  name: shared
  labels:
    zilla.io/model: shared
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shared
  labels:
    app.kubernetes.io/name: postgres
    zilla.io/model: shared
type: Opaque
data:
  DB_USERNAME: dXNlcg==  # base64("user")
  DB_PASSWORD: cGFzcw==  # base64("pass")
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: shared
type: Opaque
data:
  REDIS_PASSWORD: cGFzc3dvcmQ=  # base64("password")
