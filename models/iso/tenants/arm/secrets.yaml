apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  # namespace applied at apply time
type: Opaque
data:
  DB_USERNAME: dXNlcg==        # base64("user")  (admin)
  DB_PASSWORD: cGFzcw==        # base64("pass")  (admin)
  DB_USER_TENANT: dGVuYW50      # base64("tenant")
  DB_PASS_TENANT: dGVuYW50cGFzcw==  # base64("tenantpass")
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  # namespace applied at apply time
type: Opaque
data:
  REDIS_PASSWORD: cGFzc3dvcmQ=  # base64("password")
