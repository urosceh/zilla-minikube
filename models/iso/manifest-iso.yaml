# ISO tenant-agnostic manifest (apply with: kubectl apply -n <tenant> -f manifest-iso.yaml)
# FE/BE: 128Mi 0.25 CPU; Postgres: 1Gi 0.5 CPU (3Gi PVC); Redis minimal

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5450
      targetPort: 5450
  selector:
    app: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "zilla"
            - name: PGPORT
              value: "5450"
          ports:
            - containerPort: 5450
          resources:
            requests:
              cpu: "0.5"
              memory: "1Gi"
            limits:
              cpu: "0.5"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command: ["sh","-c","redis-server --requirepass $REDIS_PASSWORD"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "0.1"
              memory: "64Mi"
            limits:
              cpu: "0.1"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-backend
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: zilla-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-backend
  template:
    metadata:
      labels:
        app: zilla-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          command: ["sh","-c","until pg_isready -h postgres -p 5450; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-redis
          image: redis:6.2-alpine
          command: ["sh","-c","until redis-cli -h redis -p 6379 ping; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: zilla-backend
          image: hatch33/zilla-backend:v1.0.0-shared
          imagePullPolicy: Always
          command: ["npm","run","start:prod-local"]
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5450"
            - name: DB_NAME
              value: "zilla"
            # tenant user/pass for app connection
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER_TENANT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASS_TENANT
            - name: JWT_SECRET
              value: "secret"
            - name: JWT_EXPIRES_IN_IN_SECONDS
              value: "100000"
            - name: NODE_ENV
              value: "test"
            - name: ADMIN_EMAL
              value: "admin@example.com"
            - name: ADMIN_PASSWORD
              value: "pass123!"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: TENANT_CONFIG_PATH
              value: "/etc/tenant-config/tenants.json"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: tenant-config
              mountPath: /etc/tenant-config
              readOnly: true
          resources:
            requests:
              cpu: "0.25"
              memory: "128Mi"
            limits:
              cpu: "0.25"
              memory: "128Mi"
      volumes:
        - name: tenant-config
          configMap:
            name: tenant-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-bff
spec:
  selector:
    app: nginx-bff
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-bff
  template:
    metadata:
      labels:
        app: nginx-bff
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "0.1"
            memory: "64Mi"
          limits:
            cpu: "0.1"
            memory: "64Mi"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-frontend
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: zilla-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-frontend
  template:
    metadata:
      labels:
        app: zilla-frontend
    spec:
      containers:
        - name: zilla-frontend
          image: hatch33/zilla-frontend:v1.0.0-shared
          imagePullPolicy: Always
          command: ["npm","run","start"]
          env:
            - name: PORT
              value: "8080"
            - name: NGINX_URL
              value: "/api"
            - name: REACT_APP_NGINX_URL
              value: "/api"
            - name: API_HOST
              value: "zilla-backend"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "0.5"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zilla-migrations
spec:
  template:
    spec:
      containers:
        - name: migrations
          image: hatch33/zilla-migrations:latest
          imagePullPolicy: Always
          env:
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: "dbchangelog.xml"
            - name: LIQUIBASE_COMMAND_UPDATE_URL
              value: "jdbc:postgresql://postgres:5450/zilla"
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USERNAME
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: LIQUIBASE_LOG_LEVEL
              value: "info"
          workingDir: /liquibase/changelog
          command: ["liquibase"]
          args: ["update"]
      restartPolicy: Never
