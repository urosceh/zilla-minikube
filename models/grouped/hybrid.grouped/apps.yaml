# Hybrid application tier — namespace hybrid
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-backend-datadog
  namespace: hybrid-grouped
  labels:
    app.kubernetes.io/name: zilla-backend-datadog
    app.kubernetes.io/component: backend
    zilla.io/model: grouped
    zilla.io/tenant: datadog
    zilla.io/group: hybrid
    monitoring.zilla.io/scrape: backend
spec:
  ports:
    - name: metrics
      port: 3000
      targetPort: 3000
  selector:
    app: zilla-backend-datadog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-backend-datadog
  namespace: hybrid-grouped
  labels:
    app.kubernetes.io/name: zilla-backend-datadog
    app.kubernetes.io/component: backend
    zilla.io/model: grouped
    zilla.io/tenant: datadog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-backend-datadog
  template:
    metadata:
      labels:
        app: zilla-backend-datadog
        app.kubernetes.io/name: zilla-backend-datadog
        app.kubernetes.io/component: backend
        zilla.io/model: grouped
        zilla.io/tenant: datadog
    spec:
      containers:
        - name: zilla-backend
          image: zilla-backend:local-master-a64b6c44
          imagePullPolicy: IfNotPresent
          command: ["node", "build/index.js"]
          env:
            - name: ZILLA_MODEL
              value: grouped
            - name: ZILLA_TENANT
              value: datadog
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5450"
            - name: DB_NAME
              value: zilla
            - name: DB_SCHEMA
              value: datadog
            - name: PGOPTIONS
              value: "-c search_path=datadog,public"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-datadog
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-datadog
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "1"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              value: secret
            - name: NODE_ENV
              value: test
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
