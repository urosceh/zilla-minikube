# GROUPED-SHARED manifest (namespace: shared-grouped)
# Tenants (8): mongo, oracle, qualcomm, salesforce, sap, shopify, stripe, twilio

apiVersion: v1
kind: Namespace
metadata:
  name: shared-grouped
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shared-grouped
spec:
  type: ClusterIP
  ports:
    - port: 5450
      targetPort: 5450
  selector:
    app: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: shared-grouped
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shared-grouped
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "zilla"
            - name: PGPORT
              value: "5450"
          ports:
            - containerPort: 5450
          resources:
            requests:
              cpu: "0.5"
              memory: "1Gi"
            limits:
              cpu: "0.5"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shared-grouped
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shared-grouped
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command: ["sh","-c","redis-server --requirepass $REDIS_PASSWORD"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "0.1"
              memory: "64Mi"
            limits:
              cpu: "0.1"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-backend
  namespace: shared-grouped
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: zilla-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-backend
  namespace: shared-grouped
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-backend
  template:
    metadata:
      labels:
        app: zilla-backend
    spec:
      containers:
        - name: zilla-backend
          image: hatch33/zilla-backend:v1.0.0-shared
          imagePullPolicy: Always
          command: ["npm","run","start:prod-local"]
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5450"
            - name: DB_NAME
              value: "zilla"
            - name: JWT_SECRET
              value: "secret"
            - name: JWT_EXPIRES_IN_IN_SECONDS
              value: "100000"
            - name: NODE_ENV
              value: "test"
            - name: ADMIN_EMAL
              value: "admin@example.com"
            - name: ADMIN_PASSWORD
              value: "pass123!"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: TENANT_CONFIG_PATH
              value: "/etc/tenant-config/tenants.json"
            - name: DB_POOL_MAX
              value: "2"
            - name: DB_POOL_MIN
              value: "0"
            - name: DB_POOL_IDLE
              value: "10000"
            - name: DB_POOL_EVICT
              value: "10000"
            - name: UV_THREADPOOL_SIZE
              value: "15"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=400"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: tenant-config
              mountPath: /etc/tenant-config
              readOnly: true
          resources:
            requests:
              cpu: "0.5"
              memory: "256Mi"
            limits:
              cpu: "0.5"
              memory: "256Mi"
      volumes:
        - name: tenant-config
          configMap:
            name: tenant-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-config
  namespace: shared-grouped
data:
  tenants.json: |
    {
      "mongo": { "tenantId": "mongo", "schemaName": "mongo", "displayName": "Mongo", "redisDb": 1, "isActive": true },
      "oracle": { "tenantId": "oracle", "schemaName": "oracle", "displayName": "Oracle", "redisDb": 2, "isActive": true },
      "qualcomm": { "tenantId": "qualcomm", "schemaName": "qualcomm", "displayName": "Qualcomm", "redisDb": 3, "isActive": true },
      "salesforce": { "tenantId": "salesforce", "schemaName": "salesforce", "displayName": "Salesforce", "redisDb": 4, "isActive": true },
      "sap": { "tenantId": "sap", "schemaName": "sap", "displayName": "SAP", "redisDb": 5, "isActive": true },
      "shopify": { "tenantId": "shopify", "schemaName": "shopify", "displayName": "Shopify", "redisDb": 6, "isActive": true },
      "stripe": { "tenantId": "stripe", "schemaName": "stripe", "displayName": "Stripe", "redisDb": 7, "isActive": true },
      "twilio": { "tenantId": "twilio", "schemaName": "twilio", "displayName": "Twilio", "redisDb": 8, "isActive": true }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: shared-grouped
data:
  default.conf: |
    server {
      listen 80;

      location /api/ {
        proxy_pass http://zilla-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://zilla-frontend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-bff
  namespace: shared-grouped
spec:
  selector:
    app: nginx-bff
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bff
  namespace: shared-grouped
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-bff
  template:
    metadata:
      labels:
        app: nginx-bff
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "0.1"
            memory: "64Mi"
          limits:
            cpu: "0.1"
            memory: "64Mi"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-frontend
  namespace: shared-grouped
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: zilla-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-frontend
  namespace: shared-grouped
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-frontend
  template:
    metadata:
      labels:
        app: zilla-frontend
    spec:
      containers:
        - name: zilla-frontend
          image: hatch33/zilla-frontend:v1.0.0-shared
          imagePullPolicy: Always
          command: ["npm","run","start"]
          env:
            - name: PORT
              value: "8080"
            - name: NGINX_URL
              value: "/api"
            - name: REACT_APP_NGINX_URL
              value: "/api"
            - name: API_HOST
              value: "zilla-backend"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "0.5"
              memory: "256Mi"
            limits:
              cpu: "0.5"
              memory: "256Mi"
