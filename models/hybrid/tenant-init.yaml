# Per-tenant schema initialization for shared PostgreSQL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-init-atlassian
  namespace: hybrid
  labels:
    app.kubernetes.io/name: tenant-init
    app.kubernetes.io/component: database
    zilla.io/model: hybrid
    zilla.io/tenant: atlassian
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-init
        zilla.io/model: hybrid
        zilla.io/tenant: atlassian
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -h postgres -p 5450 -U user -d zilla -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' -c "CREATE SCHEMA IF NOT EXISTS atlassian AUTHORIZATION \"user\";"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
