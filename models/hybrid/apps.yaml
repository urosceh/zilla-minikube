---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: hybrid
  labels:
    app.kubernetes.io/name: nginx-bff
    app.kubernetes.io/component: gateway
    zilla.io/model: hybrid
data:
  default.conf: |
    server {
      listen 80;

      location /api/atlassian/ {
        proxy_pass http://zilla-backend-atlassian:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /api/baidu/ {
        proxy_pass http://zilla-backend-baidu:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /api/blackrock/ {
        proxy_pass http://zilla-backend-blackrock:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /atlassian/ {
        proxy_pass http://zilla-frontend:8080/atlassian/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /baidu/ {
        proxy_pass http://zilla-frontend:8080/baidu/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /blackrock/ {
        proxy_pass http://zilla-frontend:8080/blackrock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://zilla-frontend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-bff
  namespace: hybrid
  labels:
    app.kubernetes.io/name: nginx-bff
    app.kubernetes.io/component: gateway
    zilla.io/model: hybrid
spec:
  type: LoadBalancer
  selector:
    app: nginx-bff
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bff
  namespace: hybrid
  labels:
    app.kubernetes.io/name: nginx-bff
    app.kubernetes.io/component: gateway
    zilla.io/model: hybrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-bff
  template:
    metadata:
      labels:
        app: nginx-bff
        app.kubernetes.io/name: nginx-bff
        app.kubernetes.io/component: gateway
        zilla.io/model: hybrid
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: zilla-frontend
  namespace: hybrid
  labels:
    app.kubernetes.io/name: zilla-frontend
    app.kubernetes.io/component: frontend
    zilla.io/model: hybrid
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: zilla-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-frontend
  namespace: hybrid
  labels:
    app.kubernetes.io/name: zilla-frontend
    app.kubernetes.io/component: frontend
    zilla.io/model: hybrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-frontend
  template:
    metadata:
      labels:
        app: zilla-frontend
        app.kubernetes.io/name: zilla-frontend
        app.kubernetes.io/component: frontend
        zilla.io/model: hybrid
    spec:
      containers:
        - name: zilla-frontend
          image: zilla-frontend:local-master-shared-3107d77
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start"]
          env:
            - name: PORT
              value: "8080"
            - name: REACT_APP_NGINX_URL
              value: /api
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
