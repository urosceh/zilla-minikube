# Per-tenant Liquibase jobs (shared PostgreSQL, per-schema)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zilla-migrations-atlassian
  namespace: hybrid
  labels:
    app.kubernetes.io/name: zilla-migrations
    app.kubernetes.io/component: migrations
    zilla.io/model: hybrid
    zilla.io/tenant: atlassian
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: hatch33/zilla-migrations@sha256:1cf36e1143114f5ad2b3043ec1d6f2692809ba537c7ac6ed9e946fdd71504bac
          imagePullPolicy: IfNotPresent
          workingDir: /liquibase/changelog
          command: ["liquibase"]
          args: ["update"]
          env:
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: dbchangelog.xml
            - name: LIQUIBASE_COMMAND_UPDATE_URL
              value: jdbc:postgresql://postgres:5450/zilla?options=-c%20search_path%3Datlassian%2Cpublic
            - name: LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME
              value: atlassian
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-atlassian
                  key: DB_USERNAME
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret-atlassian
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
