---
# =====================
# Nginx BFF Config
# =====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;

        location /api/ {
            proxy_pass http://zilla-backend:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://zilla-frontend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

---
# =====================
# Nginx BFF Service
# =====================
apiVersion: v1
kind: Service
metadata:
  name: nginx-bff
spec:
  selector:
    app: nginx-bff
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer

---
# =====================
# Nginx BFF Deployment
# =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-bff
  template:
    metadata:
      labels:
        app: nginx-bff
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        ports:
        - containerPort: 80
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config

---
# =====================
# Zilla Frontend Service
# =====================
apiVersion: v1
kind: Service
metadata:
  name: zilla-frontend
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: zilla-frontend

---
# =====================
# Zilla Frontend Deployment
# =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zilla-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zilla-frontend
  template:
    metadata:
      labels:
        app: zilla-frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -s -f -o /dev/null http://zilla-backend:3000/ || curl -s http://zilla-backend:3000/ | grep -q "Cannot GET"; do
                echo "Waiting for zilla-backend to be ready..."
                sleep 2
              done
              echo "zilla-backend is ready!"
      containers:
        - name: zilla-frontend
          image: hatch33/zilla-frontend:v1.0.0-shared
          imagePullPolicy: Always
          command: ["npm", "run", "start"]
          env:
            - name: PORT
              value: "8080"
            - name: NGINX_URL
              value: "/api"
            - name: REACT_APP_NGINX_URL
              value: "/api"
            - name: API_HOST
              value: "zilla-backend"
          ports:
            - containerPort: 8080
